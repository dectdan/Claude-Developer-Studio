name: Build Installer

# Manual only. It runs the same Installer\build-setup.ps1 as a local build (CLI, TrayApp,
# Dashboard, the VS Bridge VSIX with Visual Studio's MSBuild, both MCP servers, the
# Review Panel, the bundled runtimes, NSIS) and uploads the EXE as a workflow artifact.
# It has not been run on GitHub's Windows runner yet, so it does not start on tag pushes
# and does not publish a release: releases are published by hand (docs\GROUND_TRUTH.md
# section 10) after the EXE has been tested.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install NSIS
      run: choco install nsis -y --no-progress
      shell: powershell

    - name: Build the installer (Installer\build-setup.ps1)
      run: powershell -NoProfile -ExecutionPolicy Bypass -File Installer\build-setup.ps1
      shell: powershell

    - name: Upload the installer
      uses: actions/upload-artifact@v4
      with:
        name: ClaudeDevStudio-Setup
        path: Installer/Output/ClaudeDevStudio-Setup.exe
        if-no-files-found: error
